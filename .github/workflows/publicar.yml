name: Publicar

# Só push na main. O gatilho de pull request ficaria tentador para ver o build
# antes de mesclar, mas este job assume uma role da AWS com permissão de
# escrita no bucket — e num repositório público qualquer pessoa abre um PR.
# Quem quiser publicar fora de um push usa o botão do workflow_dispatch.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Duas publicações ao mesmo tempo podem terminar fora de ordem e deixar no ar
# o build mais antigo. A fila garante uma de cada vez; `cancel-in-progress`
# fica falso de propósito, para não abortar um sync pela metade.
concurrency:
  group: publicar
  cancel-in-progress: false

permissions:
  contents: read
  # Permite ao job pedir o token OIDC que a AWS troca por credencial temporária.
  # Sem esta linha o pedido falha, e é o erro mais comum de quem monta isso.
  id-token: write

jobs:
  publicar:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # O mesmo que roda na máquina antes de qualquer commit. Aqui ele vira
      # barreira: nada chega ao ar sem passar.
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

      - run: pnpm build
        env:
          PUBLIC_RECAPTCHA_SITE_KEY: ${{ vars.PUBLIC_RECAPTCHA_SITE_KEY }}
          PUBLIC_API_BASE_URL: ${{ vars.PUBLIC_API_BASE_URL }}

      # O `sub` é o campo do token OIDC que a política de confiança da role
      # compara. Quando a AWS recusa com "Not authorized to perform
      # sts:AssumeRoleWithWebIdentity", ela não diz qual parte não conferiu —
      # então o valor fica impresso aqui, para comparar com a condição escrita
      # na role. Não é segredo: diz apenas o repositório e a branch.
      # TEMPORARIO - diagnostico. Le o proprio token OIDC e publica as claims
      # que a politica de confianca compara. O token nunca e impresso: so o
      # `sub`, o `aud` e o `ref`, que nao sao segredo. Sai daqui assim que o
      # deploy passar.
      - name: Claims reais do token OIDC
        run: |
          python3 - <<'FIM'
          import base64, json, os, urllib.request

          url = os.environ['ACTIONS_ID_TOKEN_REQUEST_URL'] + '&audience=sts.amazonaws.com'
          pedido = urllib.request.Request(
              url,
              headers={'Authorization': 'bearer ' + os.environ['ACTIONS_ID_TOKEN_REQUEST_TOKEN']},
          )
          token = json.load(urllib.request.urlopen(pedido))['value']

          carga = token.split('.')[1]
          carga += '=' * (-len(carga) % 4)
          claims = json.loads(base64.urlsafe_b64decode(carga))

          # repr() revela espaco ou caractere invisivel sobrando
          resumo = ' | '.join(
              f'{nome}={claims.get(nome)!r}' for nome in ('sub', 'aud', 'repository', 'ref')
          )
          print(resumo)
          print(f'::notice title=claims::{resumo}')
          FIM

      # Nenhuma chave guardada: o GitHub apresenta um token assinado dizendo
      # qual repositório e qual branch estão rodando, e a AWS devolve uma
      # credencial que vale por esta execução.
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - run: node scripts/publicar.mjs
        env:
          MINIME_BUCKET: ${{ vars.MINIME_BUCKET }}
          MINIME_DISTRIBUICAO: ${{ vars.MINIME_DISTRIBUICAO }}
